            { category: "CABIN", items: ["Passengers", "Events / Distraction", "Interruptions", "Cabin crew"] },
            { category: "OTHER", items: ["Complacency"] }
        ];

        // ==========================================
        // UI 元件：過濾開關
        // ==========================================
        const FilterToggle = ({ active, onClick, icon: Icon, label, activeColorClass, inactiveColorClass, dotColor }) => (
          <div onClick={onClick} className={`flex items-center gap-1.5 border py-1.5 px-3 rounded-lg shadow-sm cursor-pointer transition-colors select-none ${active ? activeColorClass : inactiveColorClass}`}>
            <Icon className={`w-4 h-4 ${active ? '' : 'opacity-60'}`} />
            <label className="text-sm font-bold whitespace-nowrap cursor-pointer">{label}</label>
            <div className={`relative inline-flex h-4 w-7 items-center rounded-full transition-colors ml-1 ${active ? dotColor : 'bg-slate-300'}`}>
              <span className={`inline-block h-3 w-3 transform rounded-full bg-white transition-transform ${active ? 'translate-x-3.5' : 'translate-x-0.5'}`} />
            </div>
          </div>
        );

        // ==========================================
        // 模組：Threats And Mitigation 評估面板
        // ==========================================
        function ThreatsApp({ selectedThreats, onToggle }) {
            return (
                <div className="max-w-6xl mx-auto px-3 mt-3 pb-4">
                    <div className="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-200">
                        <div className="bg-[#4878d0] text-white p-4 text-center font-black text-2xl tracking-wider">
                            THREATS AND MITIGATION
                        </div>
                        <div className="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 bg-slate-50">
                            {THREATS_DATA.map((block, idx) => (
                                <div key={idx} className="border border-slate-300 rounded-xl overflow-hidden shadow-sm flex flex-col bg-white">
                                    <div className="bg-[#e6f0ff] border-b border-slate-200 p-2.5 text-center font-black text-slate-800 uppercase tracking-wide">
                                        {block.category}
                                    </div>
                                    <div className="p-3 flex-1 flex flex-col gap-1.5">
                                        {block.items.map(item => {
                                            const isSelected = selectedThreats.some(t => t.category === block.category && t.item === item);
                                            return (
                                                <button
                                                    key={item}
                                                    onClick={() => onToggle(block.category, item)}
                                                    className={`text-left px-3 py-2 rounded-lg text-[15px] transition-all duration-150 flex items-start gap-2.5 outline-none border border-transparent ${
                                                        isSelected 
                                                        ? 'bg-[#b4f25b] text-black font-bold shadow-sm' 
                                                        : 'bg-transparent text-slate-700 hover:bg-slate-100 font-medium'
                                                    }`}
                                                >
                                                    <span className={`mt-1.5 h-1.5 w-1.5 rounded-full shrink-0 ${isSelected ? 'bg-black' : 'bg-slate-400'}`}></span>
                                                    <span className="leading-snug">{item}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 模組 1: Norma Filter v2 (處理顯示邏輯與多重高亮)
        // ==========================================
        function NotamFilterApp({ rawText, onPinnedUpdate }) {
          const [parsedData, setParsedData] = useState(null); 
          const [flightInfo, setFlightInfo] = useState(null); 
          const [activeTab, setActiveTab] = useState('DEP');
          const [showFiltered, setShowFiltered] = useState(true); 
          const [bufferHours, setBufferHours] = useState(1); 
          const [localError, setLocalError] = useState(null);
          const [selectedNotams, setSelectedNotams] = useState([]);
          const [expandedAirportNotams, setExpandedAirportNotams] = useState({});

          const [hideObstacles, setHideObstacles] = useState(true);
          const [hideBirds, setHideBirds] = useState(true);
          const [hideUAS, setHideUAS] = useState(true);
          const [hideMowing, setHideMowing] = useState(true);

          useEffect(() => {
            if (onPinnedUpdate && flightInfo) {
              const allNotams = [...(flightInfo.depNotams || []), ...(flightInfo.destNotams || [])];
              const pinned = allNotams.filter(n => selectedNotams.includes(n.id));
              const uniquePinned = Array.from(new Map(pinned.map(item => [item.id, item])).values());
              onPinnedUpdate(uniquePinned);
            }
          }, [selectedNotams, flightInfo]);

          const toggleNotamSelection = (id) => {
            setSelectedNotams(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          };

          useEffect(() => {
            window.scrollTo({ top: 0, behavior: 'auto' });
          }, [activeTab]);

          useEffect(() => {
            if (!rawText) {
                setParsedData(null); setFlightInfo(null); setLocalError(null); return;
            }
            try {
                const cleanText = sanitizeText(rawText);
                processBriefingText(cleanText);
                setLocalError(null);
            } catch (err) {
                console.error("NOTAM parsing error", err);
                setLocalError("無法在文件中找到完整的航班資訊，NOTAM 模組無法啟用。");
            }
          }, [rawText]);

          const sanitizeText = (raw) => {
            let clean = raw;
            clean = clean.replace(/---\s*PAGE\s*\d+\s*---/gi, '\n');
            clean = clean.replace(/PAGE\s*[\n\r]*\s*\d+\s*[\n\r]*\s*OF\s*[\n\r]*\s*\d+/gi, '\n');
            clean = clean.replace(/\b\d+\s*[\n\r]*\s*OF\s*[\n\r]*\s*\d+\b/gi, '\n');
            clean = clean.replace(/\bPAGE\s*[\n\r]*\s*\d+\b/gi, '\n');
            clean = clean.replace(/BR\s+\d{3}\/\d{2}[A-Za-z]{3}\d{2}\/[A-Z]{3}-[A-Z]{3}.*?OFP:\s*\d+\/\d+\/\d+/gi, '\n');
            clean = clean.replace(/Reg:\s*[A-Z0-9-]+\s*[\n\r]*\s*OFP:\s*\d+\/\d+\/\d+/gi, '\n');
            clean = clean.replace(/\+{5,}\s*[A-Z\s]+\s*\+{5,}/gi, '\n');
            return clean;
          };

          const parseZTime = (dateStr, timeStr) => {
            const months = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
            const dateMatch = dateStr.match(/(\d{2})([A-Z]{3})(\d{2})/i);
            if (!dateMatch) return new Date();
            const day = parseInt(dateMatch[1]); const month = months[dateMatch[2].toUpperCase()]; const year = 2000 + parseInt(dateMatch[3]);
            const hr = parseInt(timeStr.substring(0, 2)); const min = parseInt(timeStr.substring(2, 4));
            return new Date(Date.UTC(year, month, day, hr, min));
          };

          const parseToBlocks = (rawText) => {
            if (!rawText) return [];
            const blocks = rawText.split(/(?=\b[A-Z0-9]+\/\d{2}\s+(?:VALID:|COMPANY\s+NOTAM))/i);
            const parsed = blocks.filter(b => b.trim()).map(block => {
                const idMatch = block.match(/^([A-Z0-9]+\/\d{2})\s+(?:VALID:|COMPANY\s+NOTAM)/i);
                if (!idMatch) return null; 
                let text = block.trim();
                const headerIndex = text.search(/BR\s+\d{3}\/\d{2}[A-Za-z]{3}\d{2}/i);
                if (headerIndex !== -1 && headerIndex > 20) text = text.substring(0, headerIndex).trim();
                text = text.replace(/\+{5,}\s*[A-Z\s]+\s*\+{5,}/gi, '').trim();
                text = text.replace(/(\n\s*){2,}/g, '\n');
                return { id: idMatch[1], text: text };
            }).filter(Boolean); 

            const mergedMap = new Map();
            parsed.forEach(b => {
                if (mergedMap.has(b.id)) {
                    let existing = mergedMap.get(b.id);
                    if (!existing.text.includes(b.text)) {
                        existing.text += '\n' + b.text;
                    }
                } else {
                    mergedMap.set(b.id, { ...b });
                }
            });
            return Array.from(mergedMap.values());
          };

          const processBriefingText = (text) => {
            const routeMatch = text.match(/([A-Z]{4})\/([A-Z]{4})/);
            const dateMatch = text.match(/(\d{2}[A-Z]{3}\d{2})/i);
            const stdMatch = text.match(/STD\s+\d{4}L\s+(\d{4})Z/i);
            const staMatch = text.match(/STA\s+\d{4}L\s+(\d{4})Z/i);

            if (!routeMatch || !dateMatch || !stdMatch || !staMatch) throw new Error("Missing critical flight info");

            const depAirport = routeMatch[1]; const destAirport = routeMatch[2];
            const stdDate = parseZTime(dateMatch[1], stdMatch[1]); const staDate = parseZTime(dateMatch[1], staMatch[1]);
            if (staDate < stdDate) staDate.setUTCDate(staDate.getUTCDate() + 1);

            const depSectionMatch = text.match(/={3,}\s*DEPARTURE AIRPORT\s*={3,}([\s\S]*?)(?=={3,}\s*DESTINATION AIRPORT\s*={3,})/i);
            const destSectionMatch = text.match(/={3,}\s*DESTINATION AIRPORT\s*={3,}([\s\S]*?)(?=={3,}\s*DESTINATION ALTERNATE\(S\)\s*={3,}|={3,}\s*ENROUTE AIRPORT\(S\)\s*={3,})/i);

            setParsedData({ 
                depAirport, destAirport, std: stdDate, sta: staDate, 
                depBlocks: parseToBlocks(depSectionMatch ? depSectionMatch[1] : ''), 
                destBlocks: parseToBlocks(destSectionMatch ? destSectionMatch[1] : '') 
            });
          };

          const categorizeNotam = (text) => {
            const upperText = text.toUpperCase();
            
            const isClsd = /\b(?:CLSD|CLOSED)\b/.test(upperText);
            if (isClsd) {
                const rwyMatch = upperText.match(/\b(?:RWY|RUNWAY)\b/);
                const twyMatch = upperText.match(/\b(?:TWY|TAXIWAY|TXL|RAMP|APRON|PRKG|PARKING|BAY|STAND)\b/);
                if (rwyMatch && twyMatch) {
                    if (rwyMatch.index < twyMatch.index) return 'RWY_CLSD';
                    else return 'TWY_CLSD';
                } else if (rwyMatch) {
                    return 'RWY_CLSD';
                } else if (twyMatch) {
                    return 'TWY_CLSD';
                }
            }

            if (/\bCOMPANY\s+NOTAM\b/.test(upperText)) return 'COMPANY_NOTAM';
            if (/\b(?:MISSED\s+APPROACH|MISSED\s+APCH|MAPT|MAPC)\b/.test(upperText)) return 'MISSED_APPROACH';
            if (/\b(?:TAKEOFF\s+MINIMUMS?|TAKEOFF\s+MINIMA|TKOF\s+MINIMUMS?|TKOF\s+MINIMA)\b/.test(upperText)) return 'TAKEOFF_MINIMUM';
            
            const isLandingMin = /\b(?:APP\s+MINIMUM|APPROACH\s+MINIMUM|MINIMA|MINIMUMS?|DA\/MDA|OCA\/H|DA\s+\d+|HAT\s+\d+|VISIBILITY\s+RVR|RVR\s+\d+|CAT\s+II|CAT\s+III)\b/.test(upperText) || 
                             /\b(?:ILS|LOC|RNAV|RNP|VOR|NDB|GLS).*RWY.*\b(?:AMDT|ORIG)\b/.test(upperText);
            if (isLandingMin) return 'LANDING_MINIMUM';
            
            if (/\b(?:LGT|LIGHT|LIGHTS|NAV|ILS|VOR|NDB|GP|LOC|DME|PAPI|VASI|ALS|RADAR)\b/.test(upperText) && /\b(?:U\/S|UNSERVICEABLE|OUT\s+OF\s+SERVICE|OTS)\b/.test(upperText)) return 'EQUIP_US';
            if (/\b(?:BIRD|BIRDS|WILDLIFE|FOWL|FLOCK|AVIAN)\b/.test(upperText)) return 'BIRD_HAZARD';
            if (/\b(?:UAS|UNMANNED|DRONE|KITE|BALLOON|FIREWORK|LASER|PARACHUTE|UAV)\b/.test(upperText)) return 'UAS_KITE';
            if (/\b(?:MOWING|GRASS CUTTING|WEED|SWEEPING|LAWN)\b/.test(upperText) && !/\b(?:CLSD|CLOSED)\b/.test(upperText)) return 'MAINTENANCE';
            if (/\b(?:CRANE|CRANES|OBST|OBSTACLE|IRREGULAR\s+SFC|IRREGULAR\s+SURFACE)\b/.test(upperText)) return 'OBSTACLE_ETC';
            
            return 'NORMAL';
          };

          useEffect(() => {
            if (!parsedData) return;
            const { depAirport, destAirport, std, sta, depBlocks, destBlocks } = parsedData;
            
            const processBlocks = (blocks, flightTime) => {
              return blocks.map(block => {
                let { keep, reason } = checkNotamRelevance(block.text, flightTime, bufferHours);
                const category = categorizeNotam(block.text);
                
                if (keep) {
                  if (category === 'OBSTACLE_ETC' && hideObstacles) { keep = false; reason = '依設定自動隱藏 (障礙物/不平整表面)'; }
                  if (category === 'BIRD_HAZARD' && hideBirds) { keep = false; reason = '依設定自動隱藏 (鳥類/野生動物警告)'; }
                  if (category === 'UAS_KITE' && hideUAS) { keep = false; reason = '依設定自動隱藏 (無人機/氣球/煙火活動)'; }
                  if (category === 'MAINTENANCE' && hideMowing) { keep = false; reason = '依設定自動隱藏 (周邊除草/例行維護)'; }
                }

                return { ...block, keep, reason, category };
              });
            };

            setFlightInfo({ depAirport, destAirport, std, sta, depNotams: processBlocks(depBlocks, std), destNotams: processBlocks(destBlocks, sta) });
          }, [parsedData, bufferHours, hideObstacles, hideBirds, hideUAS, hideMowing]);

          const checkNotamRelevance = (notamText, flightTime, buffer) => {
            const winStart = new Date(flightTime.getTime() - buffer * 3600 * 1000);
            const winEnd = new Date(flightTime.getTime() + buffer * 3600 * 1000);

            const validMatch = notamText.match(/VALID:\s*(\d{10})\s*(?:-\s*(\d{10}|PERM|UFN|EST))?/i);
            if (validMatch) {
              const parseDate10 = (str) => new Date(Date.UTC(2000 + parseInt(str.slice(0,2)), parseInt(str.slice(2,4))-1, parseInt(str.slice(4,6)), parseInt(str.slice(6,8)), parseInt(str.slice(8,10))));
              const fromDate = parseDate10(validMatch[1]);
              let toDate = new Date(Date.UTC(2099, 11, 31)); 
              if (validMatch[2] && /^\d{10}$/.test(validMatch[2])) toDate = parseDate10(validMatch[2]);

              if (winEnd < fromDate) return { keep: false, reason: '在航班起飛前尚未生效' };
              if (winStart > toDate) return { keep: false, reason: '在航班到達前已失效' };
            }

            const dailyRegex = /\b(\d{4})Z?\s*-\s*(\d{4})Z?\b/ig;
            let dailyMatch; const dailyRanges = [];
            while ((dailyMatch = dailyRegex.exec(notamText)) !== null) {
              const startMin = parseInt(dailyMatch[1].slice(0,2)) * 60 + parseInt(dailyMatch[1].slice(2,4));
              const endMin = parseInt(dailyMatch[2].slice(0,2)) * 60 + parseInt(dailyMatch[2].slice(2,4));
              if (startMin <= 1440 && endMin <= 1440) dailyRanges.push({ start: startMin, end: endMin, raw: dailyMatch[0] });
            }

            if (dailyRanges.length > 0) {
              let overlaps = false;
              for (let range of dailyRanges) {
                const rStart = new Date(flightTime); rStart.setUTCHours(Math.floor(range.start/60), range.start%60, 0, 0);
                const rEnd = new Date(flightTime); rEnd.setUTCHours(Math.floor(range.end/60), range.end%60, 0, 0);
                if (rEnd < rStart) {
                  rEnd.setUTCDate(rEnd.getUTCDate() + 1);
                  const rStartPrev = new Date(rStart); rStartPrev.setUTCDate(rStartPrev.getUTCDate() - 1);
                  const rEndPrev = new Date(rEnd); rEndPrev.setUTCDate(rEndPrev.getUTCDate() - 1);
                  if ((winStart <= rEndPrev && winEnd >= rStartPrev) || (winStart <= rEnd && winEnd >= rStart)) { overlaps = true; break; }
                } else {
                  if (winStart <= rEnd && winEnd >= rStart) { overlaps = true; break; }
                }
              }
              if (!overlaps) return { keep: false, reason: `每日時間區間不重疊 (${dailyRanges.map(r=>r.raw).join(', ')})` };
            }
            return { keep: true, reason: '符合航班時間' };
          };

          const formatZTime = (date) => `${date.getUTCDate().toString().padStart(2, '0')}${date.toLocaleString('en-US', { month: 'short', timeZone: 'UTC' }).toUpperCase()}${date.getUTCFullYear().toString().slice(-2)} ${date.getUTCHours().toString().padStart(2, '0')}${date.getUTCMinutes().toString().padStart(2, '0')}Z`;

          const FilterControls = () => (
            <div className="flex flex-col gap-3 w-full xl:w-auto mt-4 xl:mt-0 pt-4 xl:pt-0 border-t xl:border-t-0 border-slate-100">
              <div className="flex flex-wrap items-center justify-end gap-2">
                <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 py-1.5 px-3 rounded-lg shadow-sm">
                  <Clock className="w-4 h-4 text-blue-600" />
                  <label className="text-sm font-bold text-slate-700 whitespace-nowrap">過濾彈性時間:</label>
                  <select value={bufferHours} onChange={(e) => setBufferHours(Number(e.target.value))} className="bg-white border border-slate-300 rounded text-sm py-0.5 px-2 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value={0}>0 小時</option><option value={1}>1 小時 (預設)</option><option value={2}>2 小時</option>
                    <option value={3}>3 小時</option><option value={4}>4 小時</option><option value={6}>6 小時</option>
                  </select>
                </div>
              </div>
              <div className="flex flex-wrap justify-end gap-2">
                <FilterToggle active={hideObstacles} onClick={() => setHideObstacles(!hideObstacles)} icon={MountainSnow} label="障礙物/吊車" activeColorClass="bg-indigo-50 border-indigo-200 text-indigo-700" inactiveColorClass="bg-slate-50 border-slate-200 text-slate-500" dotColor="bg-indigo-500" />
                <FilterToggle active={hideBirds} onClick={() => setHideBirds(!hideBirds)} icon={Bird} label="鳥類/動物" activeColorClass="bg-cyan-50 border-cyan-200 text-cyan-700" inactiveColorClass="bg-slate-50 border-slate-200 text-slate-500" dotColor="bg-cyan-500" />
                <FilterToggle active={hideUAS} onClick={() => setHideUAS(!hideUAS)} icon={SendKite} label="氣球/無人機" activeColorClass="bg-violet-50 border-violet-200 text-violet-700" inactiveColorClass="bg-slate-50 border-slate-200 text-slate-500" dotColor="bg-violet-500" />
                <FilterToggle active={hideMowing} onClick={() => setHideMowing(!hideMowing)} icon={Tractor} label="除草/維護" activeColorClass="bg-lime-50 border-lime-200 text-lime-700" inactiveColorClass="bg-slate-50 border-slate-200 text-slate-500" dotColor="bg-lime-500" />
              </div>
            </div>
          );

          const formatNotamText = (text, isDimmed) => {
            const regex = /(\b(?:RWY|RUNWAY)\s+[0-3]?\d[LRC]?(?:\s*\/\s*[0-3]?\d[LRC]?)?\b|\b(?:TWY|TAXIWAY|TXL)\s+[A-Z0-9]+\b|\bILS(?:(?:\s+OR\s+LOC)?\s+(?:RWY|RUNWAY)?\s*[0-3]?\d[LRC]?)?\b)/gi;
            const parts = text.split(regex);
            
            return parts.map((part, idx) => {
                if (!part) return null;
                const upperPart = part.toUpperCase();
                
                if (/^\b(?:RWY|RUNWAY)\b/.test(upperPart)) {
                    return (
                        <span key={idx} className={`font-black text-black px-1 py-0.5 rounded-md shadow-sm border ${isDimmed ? 'bg-yellow-100/50 border-yellow-200' : 'bg-yellow-200/70 border-yellow-300'}`}>
                            {part}
                        </span>
                    );
                } 
                else if (/^\b(?:TWY|TAXIWAY|TXL)\b/.test(upperPart) || upperPart.startsWith('ILS')) {
                    return (
                        <span key={idx} className={`font-black ${isDimmed ? 'text-slate-600' : 'text-slate-900'}`}>
                            {part}
                        </span>
                    );
                }
                return <Fragment key={idx}>{part}</Fragment>;
            });
          };

          const summarizeAirportNotam = (notam) => {
            const text = String(notam.text || '').replace(/\s+/g, ' ').trim();
            const upper = text.toUpperCase();

            const rwy = Array.from(new Set((text.match(/\b(?:RWY|RUNWAY)\s*[0-3]?\d[LRC]?(?:\s*\/\s*[0-3]?\d[LRC]?)?/gi) || []).map(x => x.replace(/\s+/g, ' ').toUpperCase())));
            const twy = Array.from(new Set((text.match(/\b(?:TWY|TAXIWAY|TXL)\s*[A-Z0-9-]+/gi) || []).map(x => x.replace(/\s+/g, ' ').toUpperCase())));
            const ils = Array.from(new Set((text.match(/\b(?:ILS|LOC|GP|DME|PAPI|VASI|ALS|VOR|NDB)\b(?:\s+(?:RWY|RUNWAY)?\s*[0-3]?\d[LRC]?)?/gi) || []).map(x => x.replace(/\s+/g, ' ').toUpperCase())));
            const timeRange = (text.match(/\b\d{4}Z?\s*-\s*\d{4}Z?\b/g) || []).slice(0, 3);
            const valid = text.match(/VALID:\s*(\d{10})\s*-\s*(\d{10}|PERM|UFN|EST)?/i);

            let action = 'Airport NOTAM. Review original text if relevant.';
            if (/\b(?:RWY|RUNWAY)\b.*\b(?:CLSD|CLOSED)\b|\b(?:CLSD|CLOSED)\b.*\b(?:RWY|RUNWAY)\b/.test(upper)) action = 'Runway closure / runway availability change. Confirm runway in use and performance.';
            else if (/\b(?:TWY|TAXIWAY|TXL|APRON|RAMP|STAND|BAY|PRKG|PARKING)\b.*\b(?:CLSD|CLOSED)\b|\b(?:CLSD|CLOSED)\b.*\b(?:TWY|TAXIWAY|TXL|APRON|RAMP|STAND|BAY|PRKG|PARKING)\b/.test(upper)) action = 'Taxiway / apron / stand closure. Check taxi route and ground movement.';
            else if (/\b(?:ILS|LOC|GP|DME|PAPI|VASI|ALS|VOR|NDB|LGT|LIGHTS?)\b.*\b(?:U\/S|UNSERVICEABLE|OUT OF SERVICE|OTS)\b/.test(upper)) action = 'Navigation aid / lighting unserviceable. Check approach minima and backup procedure.';
            else if (/\b(?:TAKEOFF MINIMUM|TAKEOFF MINIMA|TKOF MINIMUM|TKOF MINIMA)\b/.test(upper)) action = 'Takeoff minima changed. Review airport takeoff minimums.';
            else if (/\b(?:MISSED APPROACH|MISSED APCH|MAPT|MAPC)\b/.test(upper)) action = 'Missed approach procedure changed. Review approach chart before briefing.';
            else if (/\b(?:APPROACH MINIMUM|APP MINIMUM|MINIMA|DA\/MDA|OCA\/H|CAT II|CAT III|RVR)\b/.test(upper)) action = 'Approach / landing minima changed. Confirm applicable minima.';
            else if (/\b(?:BIRD|WILDLIFE|FLOCK)\b/.test(upper)) action = 'Bird / wildlife activity. Use caution during takeoff / landing.';
            else if (/\b(?:UAS|DRONE|BALLOON|KITE|LASER|FIREWORK)\b/.test(upper)) action = 'UAS / aerial activity nearby. Maintain lookout and follow ATC.';
            else if (/\bCOMPANY\s+NOTAM\b/.test(upper)) action = 'Company NOTAM. Review operational note.';
            else if (/\b(?:CRANE|OBST|OBSTACLE)\b/.test(upper)) action = 'Obstacle / crane notice. Check location versus runway / approach path.';

            const chips = [];
            const add = (x) => { if (x && !chips.includes(x)) chips.push(x); };
            rwy.slice(0, 3).forEach(add);
            twy.slice(0, 2).forEach(add);
            ils.slice(0, 2).forEach(add);
            timeRange.forEach(add);
            if (valid) add(`VALID ${valid[1]}-${valid[2] || ''}`);

            return { action, chips };
          };

        // ==========================================
        // 模組：ATIS.guru 起飛 / 降落機場 D-ATIS

        function AtisGuruApp({ rawText, onAtisDataUpdate }) {
          const [routeInfo, setRouteInfo] = useState(null);
          const [atisData, setAtisData] = useState({});
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState(null);

          useEffect(() => {
            if (!rawText) {
              setRouteInfo(null);
              setAtisData({});
              if (onAtisDataUpdate) onAtisDataUpdate({});
              setError(null);
              return;
            }
            try {
              const data = parseOFP(rawText);
              if (!data || data.depIcao === 'N/A' || data.arrIcao === 'N/A') throw new Error('Missing ICAO');
              const nextRoute = { depIcao: data.depIcao, arrIcao: data.arrIcao };
              setRouteInfo(nextRoute);
              setError(null);
              fetchAtisForRoute(nextRoute);
            } catch (err) {
              console.error('ATIS route parse error:', err);
              setError('無法從 OFP 解析起飛 / 降落機場 ICAO，ATIS 模組無法啟用。');
            }
          }, [rawText]);

          const fetchRawViaProxy = async (url) => {
            // 快速顯示版：先用 Jina Reader 把 atis.guru 轉成純文字，通常比一般 CORS 代理快很多。
            // 直接 fetch atis.guru 多數瀏覽器會被 CORS 擋；iframe 又會被 atis.guru 擋，所以採「抓純文字後在本頁顯示」。
            const sources = [
              `https://r.jina.ai/${url}`,
              `https://r.jina.ai/http://r.jina.ai/http://http://${url.replace(/^https?:\/\//, '')}`,
              `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
              `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];
            for (let i = 0; i < sources.length; i++) {
              const p = sources[i];
              try {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), i === 0 ? 7000 : 9000);
                const res = await fetch(p, { signal: controller.signal, cache: 'no-store' });
                clearTimeout(id);
                if (res.ok) {
                  const text = await res.text();
                  if (text && text.trim().length > 30) return text;
                }
              } catch (e) { }
            }
            return '';
          };

          const normalizeAtisText = (s) => (s || '').replace(/\s+/g, ' ').replace(/=\s*/g, '=').trim();

          const parseAtisHtml = (html, icao) => {
            const result = { icao, arr: null, dep: null, metar: null, taf: null, sourceUrl: `https://atis.guru/atis/${icao}` };
            if (!html) return result;

            const cleanMarkdownMarks = (s) => (s || '')
              .replace(/^#+\s*/gm, '')
              .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
              .replace(/\s+/g, ' ')
              .trim();

            const stripNoise = (s) => cleanMarkdownMarks(s)
              .replace(/^(No ATIS available\.{0,3}|An unhandled error has occurred\.?|Reload)\s*/i, '')
              .trim();

            const readFromPlainText = (plainText, label) => {
              const normalized = (plainText || '')
                .replace(/\r/g, '\n')
                .replace(/\u00a0/g, ' ')
                .replace(/[ \t]+/g, ' ')
                .replace(/\n{3,}/g, '\n\n');
              const labelRegex = label === 'ARR' ? /Arrival\s+ATIS/i : /Departure\s+ATIS/i;
              const match = labelRegex.exec(normalized);
              if (!match) return null;
              const startIdx = match.index + match[0].length;
              const rest = normalized.slice(startIdx);
              const nextMatch = rest.search(/\n\s*#{0,6}\s*(Arrival\s+ATIS|Departure\s+ATIS|METAR|TAF)\b/i);
              const section = nextMatch >= 0 ? rest.slice(0, nextMatch) : rest;
              const timeMatch = section.match(/(20\d{2}-\d{2}-\d{2}\s+\d{2}:\d{2}\s+UTC)/i);
              const time = timeMatch ? timeMatch[1] : '';
              let text = section.replace(/20\d{2}-\d{2}-\d{2}\s+\d{2}:\d{2}\s+UTC/i, ' ');
              text = stripNoise(text);
              if (!text) return null;
              return { time, text };
            };

            try {
              const doc = new DOMParser().parseFromString(html, 'text/html');
              const bodyText = (doc.body && (doc.body.innerText || doc.body.textContent) ? (doc.body.innerText || doc.body.textContent) : html);

              // atis.guru 會同時輸出一段「No ATIS available」和後面的實際靜態內容；
              // 不要被前段文字誤判，直接從 Arrival / Departure 標題後方抓資料。
              result.arr = readFromPlainText(bodyText, 'ARR');
              result.dep = readFromPlainText(bodyText, 'DEP');

              const readWeatherSection = (plainText, label) => {
                const normalized = (plainText || '')
                  .replace(/\r/g, '\n')
                  .replace(/\u00a0/g, ' ')
                  .replace(/[ \t]+/g, ' ')
                  .replace(/\n{3,}/g, '\n\n');
                const labelRegex = label === 'METAR' ? /(?:^|\n)\s*METAR\b/i : /(?:^|\n)\s*TAF\b/i;
                const match = labelRegex.exec(normalized);
                if (!match) return null;
                const startIdx = match.index + match[0].length;
                const rest = normalized.slice(startIdx);
                const nextRegex = label === 'METAR'
                  ? /\n\s*#{0,6}\s*TAF\b/i
                  : /\n\s*(?:An unhandled error has occurred|Reload|function\s+startTime|window\.|document\.|<script|Loading\.{0,3})\b/i;
                const nextMatch = rest.search(nextRegex);
                let section = nextMatch >= 0 ? rest.slice(0, nextMatch) : rest;
                section = stripNoise(section)
                  .replace(/\bAn unhandled error has occurred[\s\S]*$/i, '')
                  .replace(/\bfunction\s+startTime[\s\S]*$/i, '')
                  .replace(/\bdocument\.[\s\S]*$/i, '')
                  .replace(/\bwindow\.[\s\S]*$/i, '')
                  .trim();
                if (!section) return null;
                return `${label} ${section}`.replace(/\s+/g, ' ').trim();
              };

              result.metar = readWeatherSection(bodyText, 'METAR');
              result.taf = readWeatherSection(bodyText, 'TAF');
            } catch (err) {
              console.error('ATIS parse error:', err);
            }
            return result;
          };

          const fetchOneAtis = async (icao) => {
            const raw = await fetchRawViaProxy(`https://atis.guru/atis/${icao}`);
            return parseAtisHtml(raw, icao);
          };

          const fetchAtisForRoute = async (route = routeInfo) => {
            if (!route || !route.depIcao || !route.arrIcao) return;
            setLoading(true);
            setError(null);
            try {
              const uniqueIcaos = Array.from(new Set([route.depIcao, route.arrIcao]));
              const pairs = await Promise.all(uniqueIcaos.map(async (icao) => [icao, await fetchOneAtis(icao)]));
              const next = {};
              pairs.forEach(([icao, data]) => next[icao] = data);
              setAtisData(next);
              if (onAtisDataUpdate) onAtisDataUpdate(next);
            } catch (err) {
              console.error('ATIS fetch error:', err);
              setError('ATIS 連線失敗。請按「開啟 atis.guru」確認該站是否有資料，或稍後再重新整理。');
            } finally {
              setLoading(false);
            }
          };

          const pickAtisForRole = (airportData, role) => {
            if (!airportData) return null;
            if (role === 'DEP') return airportData.dep || airportData.arr;
            return airportData.arr || airportData.dep;
          };

          const extractAtisEssentials = (text) => {
            const upper = (text || '').toUpperCase();
            const runwaySet = new Set();
            const runwayRegex = /\b(?:RWY|RUNWAY)\s*([0-3]?\d[ LRC]?)(?:\s*\/\s*([0-3]?\d[ LRC]?))?/gi;
            let m;
            while ((m = runwayRegex.exec(upper)) !== null) {
              if (m[1]) runwaySet.add(m[1].replace(/\s+/g, ''));
              if (m[2]) runwaySet.add(m[2].replace(/\s+/g, ''));
            }
            const windMatch = upper.match(/\bWIND(?:\s+(?:TDZ|MID|END))?\s+((?:[0-3]\d{2}|VRB)\/?\d{1,3}(?:G\d{1,3})?KT|(?:[0-3]\d{2}|VRB)\d{2,3}(?:G\d{2,3})?KT)/i) || upper.match(/\b((?:[0-3]\d{2}|VRB)\d{2,3}(?:G\d{2,3})?KT)\b/i);
            const qnhMatch = upper.match(/\bQNH\s*(\d{4})(?:\s*HPA)?\b/i) || upper.match(/\bQ(\d{4})\b/i);
            const qfeMatch = upper.match(/\bQFE\s*(\d{4})(?:\s*HPA)?\b/i);
            const tempMatch = upper.match(/\b(?:TEMP(?:ERATURE)?|T)\s*(M?\d{1,2})\b/i) || upper.match(/\b(M?\d{2})\/(?:M?\d{2}|\/\/)\b/i);
            const visMatch = upper.match(/\bVIS\s*([0-9]{3,5}M?|[0-9]+KM|CAVOK)\b/i) || upper.match(/\b(CAVOK)\b/i);
            const infoMatch = upper.match(/\bINFORMATION\s+([A-Z])\b/i) || upper.match(/\bINFO\s+([A-Z])\b/i);
            const cleanTemp = tempMatch ? tempMatch[1].replace('M', '-') : '';
            return {
              runways: Array.from(runwaySet),
              wind: windMatch ? windMatch[1].replace('/', '') : '',
              temp: cleanTemp,
              qnh: qnhMatch ? qnhMatch[1] : '',
              qfe: qfeMatch ? qfeMatch[1] : '',
              vis: visMatch ? (visMatch[1] || visMatch[0]) : '',
              info: infoMatch ? infoMatch[1] : ''
            };
          };

          const findRunwayClosureConflict = (icao, runways) => {
            if (!rawText || !icao || !runways || runways.length === 0) return [];
            const compact = rawText.toUpperCase().replace(/\s+/g, ' ');
            return runways.filter(rwy => {
              const r = rwy.replace(/\s+/g, '');
              const patterns = [
                new RegExp('RWY\\s*' + r + '\\b.{0,80}\\b(?:CLSD|CLOSED)\\b', 'i'),
                new RegExp('\\b(?:CLSD|CLOSED)\\b.{0,80}RWY\\s*' + r + '\\b', 'i'),
                new RegExp('RUNWAY\\s*' + r + '\\b.{0,80}\\b(?:CLSD|CLOSED)\\b', 'i')
              ];
              return patterns.some(rx => rx.test(compact));
            });
          };

          const HighlightedAtisText = ({ text }) => {
            const regex = /(\b(?:RWY|RUNWAY)\s*[0-3]?\d[ LRC]?(?:\s*\/\s*[0-3]?\d[ LRC]?)?\b|\bWIND(?:\s+(?:TDZ|MID|END))?\s+(?:[0-3]\d{2}|VRB)\/?\d{1,3}(?:G\d{1,3})?KT\b|\b(?:[0-3]\d{2}|VRB)\d{2,3}(?:G\d{2,3})?KT\b|\bQNH\s*\d{4}(?:\s*HPA)?\b|\bQFE\s*\d{4}(?:\s*HPA)?\b|\bQ\d{4}\b|\b(?:TEMP(?:ERATURE)?|T)\s*M?\d{1,2}\b|\bM?\d{2}\/(?:M?\d{2}|\/\/)\b|\bVIS\s*(?:[0-9]{3,5}M?|[0-9]+KM|CAVOK)\b|\bINFORMATION\s+[A-Z]\b)/gi;
            const parts = (text || '').split(regex);
            return parts.map((part, idx) => {

              return <Fragment key={idx}>{part}</Fragment>;
            });
          };

          const AtisCard = ({ label, icao, role }) => {

            const preferred = role === 'DEP' ? 'Departure ATIS' : 'Arrival ATIS';

            const essentials = atis && atis.text ? extractAtisEssentials(atis.text) : { runways: [], wind: '', temp: '', qnh: '', qfe: '', vis: '', info: '' };
            return (
              <div className="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                <div className={`px-5 py-4 border-b ${role === 'DEP' ? 'bg-blue-50 border-blue-100' : 'bg-emerald-50 border-emerald-100'}`}>

                    <div>
                      <div className="text-sm font-bold text-slate-500 flex items-center gap-2">
                        {role === 'DEP' ? <PlaneTakeoff className="w-4 h-4" /> : <PlaneLanding className="w-4 h-4" />}
                        {label}
                      </div>
                      <div className="text-3xl font-black text-slate-800 tracking-wide">{icao}</div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <a href={`https://atis.guru/atis/${icao}`} target="_blank" rel="noopener noreferrer" className="text-sm font-bold text-blue-600 hover:text-blue-800 bg-white border border-blue-100 px-3 py-1.5 rounded-lg shadow-sm">
                        開啟 atis.guru
                      </a>
                    </div>
                  </div>
                </div>
                <div className="p-5 bg-slate-50 min-h-[220px]">
                  {loading && !airportData ? (
                    <div className="text-blue-600 font-bold animate-pulse flex items-center gap-2"><Clock className="w-5 h-5 animate-spin" /> ATIS 快速抓取中，通常數秒內完成...</div>
                  ) : !airportData ? (
                    <div className="text-slate-500 font-bold">尚未抓取資料</div>
                  ) : !atis || !atis.text ? (
                    <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 font-bold flex items-start gap-2">

                    <div className="space-y-4">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className={`text-xs font-black px-2.5 py-1 rounded-full border ${role === 'DEP' ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-emerald-100 text-emerald-800 border-emerald-200'}`}>{fallbackUsed ? '備用顯示' : preferred}</span>
                        {atis.time && <span className="text-xs font-bold text-slate-500 bg-white border border-slate-200 px-2.5 py-1 rounded-full">{atis.time}</span>}
                      </div>
                      {fallbackUsed && <div className="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-3 py-2 rounded-lg">找不到 {preferred}，已暫時顯示同機場另一組 ATIS。</div>}
                      {(essentials.runways.length > 0 || essentials.wind || essentials.temp || essentials.qnh || essentials.qfe || essentials.vis || essentials.info) && (
                        <div className="flex flex-wrap gap-2">
                          {essentials.info && <span className="text-xs font-black px-2.5 py-1 rounded-full bg-amber-100 text-amber-900 border border-amber-200">INFO {essentials.info}</span>}
                          {essentials.runways.map(r => <span key={r} className="text-xs font-black px-2.5 py-1 rounded-full bg-yellow-100 text-yellow-900 border border-yellow-200">RWY {r}</span>)}
                          {essentials.wind && <span className="text-xs font-black px-2.5 py-1 rounded-full bg-sky-100 text-sky-900 border border-sky-200">WIND {essentials.wind}</span>}
                          {essentials.temp && <span className="text-xs font-black px-2.5 py-1 rounded-full bg-orange-100 text-orange-900 border border-orange-200">TEMP {essentials.temp}°C</span>}
                          {essentials.vis && <span className="text-xs font-black px-2.5 py-1 rounded-full bg-violet-100 text-violet-900 border border-violet-200">VIS {essentials.vis}</span>}
                          {essentials.qnh && <span className="text-xs font-black px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-200">QNH {essentials.qnh}</span>}
                          {essentials.qfe && <span className="text-xs font-black px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-200">QFE {essentials.qfe}</span>}
                        </div>
                      )}
                      <pre className="whitespace-pre-wrap font-mono text-sm leading-relaxed text-slate-800 bg-white border border-slate-200 rounded-xl p-4 shadow-sm"><HighlightedAtisText text={atis.text} /></pre>
                      {(airportData.metar || airportData.taf) && (
                        <div className="grid grid-cols-1 gap-3">
                          {airportData.metar && <div><div className="text-xs font-black text-slate-500 mb-1">METAR</div><pre className="whitespace-pre-wrap font-mono text-xs leading-relaxed text-slate-700 bg-white border border-slate-200 rounded-lg p-3">{airportData.metar}</pre></div>}
                          {airportData.taf && <div><div className="text-xs font-black text-slate-500 mb-1">TAF</div><pre className="whitespace-pre-wrap font-mono text-xs leading-relaxed text-slate-700 bg-white border border-slate-200 rounded-lg p-3">{airportData.taf}</pre></div>}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            );
          };

          if (!routeInfo && !error) return null;

          return (
            <div className="w-full mt-4 mb-4">
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <h2 className="text-2xl font-black text-slate-800 flex items-center gap-2"><Mic className="w-6 h-6 text-sky-600" /> 起飛 / 降落 ATIS</h2>
                </div>
                <button onClick={() => fetchAtisForRoute()} disabled={loading || !routeInfo} className={`px-4 py-2 rounded-xl font-bold text-white shadow-sm flex items-center gap-2 ${loading ? 'bg-slate-400 cursor-not-allowed' : 'bg-sky-600 hover:bg-sky-700'}`}>
                  <Clock className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`} /> 重新整理 ATIS
                </button>
              </div>

              {error && <div className="mb-5 p-4 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 font-bold flex items-start gap-2"><AlertTriangle className="w-5 h-5 shrink-0 mt-0.5" />{error}</div>}

              {routeInfo && (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  <AtisCard label="起飛機場" icao={routeInfo.depIcao} role="DEP" />
                  <AtisCard label="降落機場" icao={routeInfo.arrIcao} role="ARR" />
                </div>
              )}
            </div>
          );
        }

        // ==========================================
        // 模組 2: Flight Plan Filter v1 (只處理顯示邏輯)
        // ==========================================
        const getAbsMinsFromZ = (hhmmZ, baseDate, stdMinsRaw) => {
          let hh = parseInt(hhmmZ.substring(0, 2)); let mm = parseInt(hhmmZ.substring(2, 4)); let day = baseDate;
          if (hh * 60 + mm < stdMinsRaw - 360) day += 1;
          return day * 24 * 60 + hh * 60 + mm;
        };

        const parseOFP = (text) => {
          const data = { flightNo: 'N/A', date: 'N/A', route: 'N/A', reg: 'N/A', fleetInfo: '', depIcao: 'N/A', arrIcao: 'N/A', altnIcao: 'N/A', stdL: 'N/A', stdZ: 'N/A', staL: 'N/A', staZ: 'N/A', altnEtaZ: 'N/A', stdMins: null, staMins: null, altnEtaMins: null, flightTime: 'N/A', blockTime: 'N/A', zfwLimit: 'N/A', zfwPlanned: 'N/A', ldwLimit: 'N/A', ldwPlanned: 'N/A', towLimit: 'N/A', towPlanned: 'N/A', totalFuel: 'N/A', reserveFuelSum: 'N/A', ci: 'N/A', fl: 'N/A', tkofRwy: 'N/A', sid: 'N/A', ldgRwy: 'N/A', star: 'N/A', weather: [], validityWindows: {}, baseDate: 1 };
          try {
            const topText = text.substring(0, 15000);
            const headerMatch = topText.match(/([A-Z0-9\s]+)\/(\d{2}[A-Za-z]{3}\d{2})\/([A-Z]{3,4}-[A-Z]{3,4})\s+Reg:\s*([A-Z0-9-]+)/i);
            if (headerMatch) { 
                data.flightNo = headerMatch[1].replace(/\s+/g, ''); data.date = headerMatch[2].toUpperCase(); data.route = headerMatch[3]; data.reg = headerMatch[4]; 
                let regNum = data.reg.replace(/[^0-9]/g, '');
                const fleet77M = ['16703','16705','16706','16707','16708','16709','16710','16711','16712','16713','16715','16716','16717'];
                const fleet77A = ['16718','16719','16720','16721','16722','16723','16725','16726','16727','16728','16729'];
                const fleet77B = ['16730','16731','16732','16733','16735','16736','16737','16738','16739','16740'];
                const fleet77F = ['16781','16782','16783','16785','16786','16787','16788','16789','16790'];
                if (fleet77M.includes(regNum)) data.fleetInfo = '77M (323)'; else if (fleet77A.includes(regNum)) data.fleetInfo = '77A (333)'; else if (fleet77B.includes(regNum)) data.fleetInfo = '77B (353)'; else if (fleet77F.includes(regNum)) data.fleetInfo = '77F (Cargo)';
            }
            const depArrMatch = topText.match(/([A-Z]{4})\/([A-Z]{4})/); if (depArrMatch) { data.depIcao = depArrMatch[1]; data.arrIcao = depArrMatch[2]; }
            const dateMatch = topText.match(/(\d{2})[A-Za-z]{3}\d{2}/i); if (dateMatch) data.baseDate = parseInt(dateMatch[1]);
            let stdMinsRaw = 0; const stdMatch = topText.match(/STD\s+(\d{4}L)\s+(\d{4}Z)/); if (stdMatch) { data.stdL = stdMatch[1]; data.stdZ = stdMatch[2]; stdMinsRaw = parseInt(data.stdZ.substring(0,2)) * 60 + parseInt(data.stdZ.substring(2,4)); data.stdMins = data.baseDate * 24 * 60 + stdMinsRaw; }
            const staMatch = topText.match(/STA\s+(\d{4}L)\s+(\d{4}[Zz27])/); if (staMatch) { data.staL = staMatch[1]; data.staZ = staMatch[2].replace(/[27]$/, 'Z'); if (data.stdMins !== null) data.staMins = getAbsMinsFromZ(data.staZ, data.baseDate, stdMinsRaw); }
            if (data.stdZ !== 'N/A' && data.staZ !== 'N/A') { let diff = data.staMins - data.stdMins; let hh = Math.floor(diff / 60).toString().padStart(2, '0'); let mm = (diff % 60).toString().padStart(2, '0'); data.blockTime = `${hh}:${mm}`; }
            const eteMatch = topText.match(/ETE[\s\n]*(\d{2}\.\d{2})/); if (eteMatch) data.flightTime = eteMatch[1].replace('.', ':');
            const fuelMatch = topText.match(/TOTAL[\s\n]*(\d{5,6})/); if (fuelMatch) data.totalFuel = fuelMatch[1];
            const zfwMatch = topText.match(/ZFW\s+(\d+\.\d+)\s*\/\s*(\d+\.\d+)/); if (zfwMatch) { data.zfwLimit = zfwMatch[1]; data.zfwPlanned = zfwMatch[2]; }
            const ldwMatch = topText.match(/LDW\s+(\d+\.\d+)\s*\/\s*(\d+\.\d+)/); if (ldwMatch) { data.ldwLimit = ldwMatch[1]; data.ldwPlanned = ldwMatch[2]; }
            const towMatch = topText.match(/TOW\s+(\d+\.\d+)\s*\/\s*(\d+\.\d+)/); if (towMatch) { data.towLimit = towMatch[1]; data.towPlanned = towMatch[2]; }
            let altnFuel = 0, finalResFuel = 0; const altnRegex = /ALTN\s+([A-Z]{4})?\s*(\d{3,6})\s+(\d{2})\.(\d{2})/; const altnMatch = topText.match(altnRegex);
            if (altnMatch) { if (altnMatch[1]) data.altnIcao = altnMatch[1]; altnFuel = parseInt(altnMatch[2], 10); let addH = parseInt(altnMatch[3], 10); let addM = parseInt(altnMatch[4], 10); if (data.staMins !== null) { data.altnEtaMins = data.staMins + addH * 60 + addM; let hE = Math.floor(data.altnEtaMins / 60) % 24; let mE = data.altnEtaMins % 60; data.altnEtaZ = hE.toString().padStart(2, '0') + mE.toString().padStart(2, '0') + 'Z'; } }
            const finalResMatch = topText.match(/FINAL RES[^\d]+(\d{3,6})/); if (finalResMatch) finalResFuel = parseInt(finalResMatch[1], 10); if (altnFuel || finalResFuel) data.reserveFuelSum = (altnFuel + finalResFuel).toString();
            const ciMatch = topText.match(/CRZ\s+CI(\d+)/); if (ciMatch) data.ci = ciMatch[1];

            let fplStartFLIdx = text.indexOf('(FPL-');
            if (fplStartFLIdx !== -1) {
                let fplChunk = text.substring(fplStartFLIdx, fplStartFLIdx + 3000); const flMatches = [...fplChunk.matchAll(/(?:-|\/)[NMK]\d{3,4}([FSM])(\d{3,4})/g)];
                if (flMatches.length > 0) {
                    const uniqueFLs = []; flMatches.forEach(m => { let type = m[1]; let val = parseInt(m[2], 10); let str = (type === 'F' ? 'FL' : type) + m[2]; if (!uniqueFLs.find(x => x.str === str)) uniqueFLs.push({ type, val, str }); });
                    let res = []; ['S', 'M', 'F'].forEach(t => { let list = uniqueFLs.filter(x => x.type === t).map(x => x.val); if (list.length > 0) { let init = list[0]; let max = Math.max(...list); let prefix = t === 'F' ? 'FL' : t; if (init < max) res.push(`${prefix}${init} - ${max}`); else res.push(`${prefix}${init}`); } }); data.fl = res.join(' / ');
                }
            }

            let navLogStart = text.indexOf('NAVIGATION LOG'); if (navLogStart === -1) navLogStart = 0;
            if (data.depIcao !== 'N/A') { 
                const depRegex = new RegExp(data.depIcao + '\\/([0-3]\\d[LRC]?)'); const depMatch = text.substring(navLogStart).match(depRegex); 
                if (depMatch) { data.tkofRwy = depMatch[1]; let afterDep = text.substring(navLogStart + depMatch.index, navLogStart + depMatch.index + 1000); let words = afterDep.split(/[\s\n]+/); for (let w of words) { if (/^[A-Z]{3,6}\d{1,2}[A-Z]?$/.test(w)) { data.sid = w; break; } } } 
            }
            if (data.arrIcao !== 'N/A') { 
                const arrRegex = new RegExp(data.arrIcao + '\\/([0-3]\\d[LRC]?)', 'g'); const arrMatches = [...text.substring(navLogStart).matchAll(arrRegex)];
                if (arrMatches.length > 0) { let lastArrMatch = arrMatches[arrMatches.length - 1]; data.ldgRwy = lastArrMatch[1]; let beforeArr = text.substring(navLogStart + Math.max(0, lastArrMatch.index - 1000), navLogStart + lastArrMatch.index); let words = beforeArr.split(/[\s\n]+/); for (let i = words.length - 1; i >= 0; i--) { if (/^[A-Z]{3,6}\d{1,2}[A-Z]?$/.test(words[i])) { data.star = words[i]; break; } } }
            }
            if (data.sid === 'N/A' || data.star === 'N/A') {
                let fplStartIdx = text.indexOf('(FPL-');
                if (fplStartIdx !== -1) {
                    let fplChunk = text.substring(fplStartIdx, fplStartIdx + 4000).replace(/[\r\n]+/g, ' ');

                    const timeRegex = /(\d{2}:\d{2}[Zz27]?)\s+(?:TO|T[O0Ο])\s+(\d{2}:\d{2}[Zz27]?)/gi; let tMatch;

                                  else if (isArr) { targetMins = data.staMins; targetType = 'ARR'; targetTimeZ = data.staZ; }
                                  else if (isAltn) { targetMins = data.altnEtaMins; targetType = 'ALTN'; targetTimeZ = data.altnEtaZ; }
                                  else if (isEdto) { targetMins = windows[0].startMins; targetType = 'EDTO'; }
                                  let badges = [];
                                  if (isDep) badges.push({ text: `DEP${isEdto ? '+EDTO' : ''}`, bg: isEdto ? 'bg-fuchsia-600' : 'bg-blue-600' });
                                  else if (isArr) badges.push({ text: `ARR${isEdto ? '+EDTO' : ''}`, bg: isEdto ? 'bg-fuchsia-600' : 'bg-emerald-600' });
                                  else if (isAltn) badges.push({ text: `ALTN${isEdto ? '+EDTO' : ''}`, bg: isEdto ? 'bg-fuchsia-600' : 'bg-amber-500' });
                                  else if (isEdto) badges.push({ text: `EDTO`, bg: 'bg-indigo-500' });
                                  const displayWxRaw = useLiveWx ? (liveWxData[wx.icao] || (isFetchingWx ? "正在連線抓取中..." : "無資料")) : wx.raw;
                                  return (
                                      <div key={idx} className={`bg-slate-50 rounded-xl border overflow-hidden shadow-sm flex flex-col transition-colors ${useLiveWx ? 'border-blue-300' : 'border-slate-200'}`}>
                                          <div className={`px-4 py-3 flex flex-row justify-between items-center border-b gap-3 ${useLiveWx ? 'bg-blue-50 border-blue-200' : 'bg-slate-100 border-slate-200'}`}>
                                              <div className="flex-1 min-w-0">
                                                  <h4 className="font-black text-lg text-slate-800 flex items-center gap-2">{wx.icao} {badges.map((b, i) => ( <span key={i} className={`text-xs ${b.bg} text-white px-1.5 py-0.5 rounded shadow-sm`}>{b.text}</span> ))}</h4>
                                                  <span className="text-xs font-bold text-slate-500 block truncate" title={wx.name}>{wx.name}</span>
                                              </div>
                                              <div className="text-right shrink-0 flex flex-col gap-1 items-end">
                                                  {targetType && targetTimeZ !== 'N/A' && targetType !== 'EDTO' && ( <div><span className="block text-[10px] font-bold text-slate-400 uppercase mb-1">{targetType === 'DEP' ? 'ETD' : 'ETA'}</span><span className={`block text-xs font-black px-2 py-1 rounded shadow-sm border ${targetType === 'DEP' ? 'bg-blue-100 text-blue-800 border-blue-200' : targetType === 'ARR' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-amber-100 text-amber-800 border-amber-200'}`}>{targetTimeZ}</span></div> )}
                                                  {isEdto && ( <div><span className="block text-[10px] font-bold text-slate-400 uppercase mb-1">VALID</span><div className="flex flex-col items-end gap-1">{windows.map((w, i) => ( <span key={i} className={`block text-xs font-black px-2 py-1 rounded shadow-sm border ${targetType !== 'EDTO' && targetType ? 'bg-fuchsia-100 text-fuchsia-900 border-fuchsia-200' : 'bg-yellow-100 text-red-800 border-yellow-200'}`}>{w.start}-{w.end}</span> ))}</div></div> )}
                                              </div>
                                          </div>
                                          <div className="p-4 overflow-x-auto text-sm font-mono text-slate-700 leading-relaxed whitespace-pre relative min-h-[100px]">
                                              {useLiveWx && isFetchingWx && !liveWxData[wx.icao] ? ( <div className="text-blue-600 font-bold animate-pulse flex items-center gap-2 mt-2 ml-2"><Clock className="w-5 h-5 animate-spin" /> 連線抓取中...</div> ) : ( highlightTAF(displayWxRaw, windows, targetMins, targetType, data.baseDate) )}
                                          </div>
                                      </div>
                                  );
                              })}
                          </div>
                      </div>
                  </div>
              </div>
          );
        }

        // ==========================================
        // 主程式入口: 統一上傳與狀態派發中心
        // ==========================================



        // ==========================================
        // 模組：Enroute FIR NOTAM 精簡閱讀
        // ==========================================
        function EnrouteFirNotamApp({ rawText, onImportantUpdate }) {
          const [groups, setGroups] = useState([]);
          const [expandedGroups, setExpandedGroups] = useState({});
          const [expandedNotams, setExpandedNotams] = useState({});
          const [importantFirNotams, setImportantFirNotams] = useState([]);
          const [showLow, setShowLow] = useState(false);
          const [activeFilter, setActiveFilter] = useState('ALL');

          useEffect(() => {
            if (onImportantUpdate) onImportantUpdate(importantFirNotams);
          }, [importantFirNotams]);

          const sanitize = (text) => {
            return String(text || '')
              .replace(/BR\s+\d{3}\/\d{2}[A-Za-z]{3}\d{2}\/[A-Z]{3}-[A-Z]{3}.*?Page\s+\d+\s+of\s+\d+/gi, '\n')
              .replace(/BR\s+\d{3}\/\d{2}[A-Za-z]{3}\d{2}.*?Page\s+\d+\s+of\s+\d+/gi, '\n')
              .replace(/Page\s+\d+\s+of\s+\d+/gi, '\n')
              .replace(/---\s*PAGE\s*\d+\s*---/gi, '\n')
              .replace(/\r/g, '');
          };

          const extractRouteFirOrder = (text) => {
            const order = [];
            const seen = new Set();
            const re = /^\s*-([A-Z]{4})\s+([A-Z0-9_ ]{3,60}?(?:FIR|UIR)(?:_[A-Z_]+)?)/gm;
            let m;
            while ((m = re.exec(text)) !== null) {
              const code = m[1];
              const name = m[2].replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
              if (!seen.has(code)) {
                seen.add(code);
                order.push({ code, name, idx: order.length });
              }
            }
            return order;
          };

          const parseNotamBlocks = (sectionText) => {
            const clean = String(sectionText || '').trim();
            if (!clean || /^\s*NIL\s*$/i.test(clean)) return [];
            const parts = clean.split(/(?=^\s*(?:[A-Z0-9]{1,4}\d{1,4}\/\d{2}|CO\d+\/\d{2})\s+(?:VALID:|COMPANY\s+NOTAM))/gmi);
            return parts.map(part => {
              let t = part.trim();
              if (!t) return null;
              const idMatch = t.match(/^\s*((?:[A-Z0-9]{1,4}\d{1,4}\/\d{2}|CO\d+\/\d{2}))/i);
              if (!idMatch) return null;
              t = t.replace(/\*{10,}/g, '').replace(/\n{3,}/g, '\n\n').trim();
              return { id: idMatch[1].toUpperCase(), text: t };
            }).filter(Boolean);
          };

          const getChips = (text, header) => {
            const s = (header + ' ' + text).toUpperCase();
            const chips = [];
            const add = (label) => { if (!chips.includes(label)) chips.push(label); };
            if (/\bGNSS|GPS|SPOOF|JAMM/.test(s)) add('GNSS');
            if (/\bATS\s+NOT\s+AVAILABLE|ATC|TIBA|COMMUNICATION|CONTACT|FREQUENC/.test(s)) add('ATC/COMM');
            if (/\bCLSD|CLOSED|SEGMENT CLOSED|RTE SEGMENTS CLSD|ROUTE.*CLOSED|AWY.*CLOSED/.test(s)) add('ROUTE CLSD');
            if (/\bRESTRICTED|PROHIBITED|DANGER AREA|OAP|MILITARY|AIR REFUELLING/.test(s)) add('AIRSPACE');
            if (/\bKABUL|OAKX|AFGHAN/.test(s)) add('KABUL');
            if (/\bCOMPANY\s+NOTAM|FLEET CIRCULAR|FD PRO|CAA RESTRICTION|VOYAGE REPORT/.test(s)) add('COMPANY');
            if (/\bOFFSET|LONGITUDINAL|SPACING|5NM|8NM/.test(s)) add('OFFSET/SPACING');
            if (/\bDECOMPRESSION|ESCAPE|PNR|DIVERSION|EMERGENCY DESCENT/.test(s)) add('ESCAPE');
            if (/\bBORDER|RUSSIA|URRV/.test(s)) add('BORDER');
            if (chips.length === 0) add('INFO');
            return chips;
          };

          const isValidOnlyNotam = (text) => {
            const s = String(text || '')
              .replace(/^\s*(?:[A-Z0-9]{1,4}\d{1,4}\/\d{2}|CO\d+\/\d{2})\s+/i, '')
              .replace(/VALID:\s*\d{10}\s*-\s*(?:\d{10}|UFN|PERM|EST)?/ig, '')
              .replace(/COMPANY\s+NOTAM/ig, '')
              .replace(/[-–—\s.]+/g, '')
              .trim();
            return s.length < 12;
          };

          const classifyNotam = (text, header) => {
            if (isValidOnlyNotam(text)) return 'INFO';

            const s = (header + ' ' + text).toUpperCase();

            // Do not classify a NOTAM as Critical just because the section is OAKX/Kabul.
            // It must contain actual operational trigger words.
            if (/\bATS\s+NOT\s+AVAILABLE|GNSS\s+JAMM|GPS.*(NOT|CAN NOT|CANNOT)|SPOOF|RTE SEGMENTS CLSD|SEGMENT CLOSED|ROUTE.*CLOSED|PROHIBITED AREA|DANGER AREA|EMERGENCY DESCENT|DECOMPRESSION|ESCAPE|BORDER|CAA RESTRICTION/.test(s)) {
              return 'CRITICAL';
            }
            if (/\bKABUL|OAKX|RNAV|RNP|ATC|TIBA|COMMUNICATION|CONTACT|SPACING|OFFSET|RESTRICTED|AIR REFUELLING|MILITARY|DELAYING ACTION|REPORT TO ATC/.test(s)) {
              return 'CAUTION';
            }
            if (/\bCOMPANY\s+NOTAM|FLEET CIRCULAR|FD PRO|VOYAGE REPORT/.test(s)) {
              return 'COMPANY';
            }
            return 'INFO';
          };

          const buildSummary = (text, header, chips, level) => {
            const s = text.replace(/\s+/g, ' ').trim();
            const up = s.toUpperCase();

            if (isValidOnlyNotam(text)) return 'Only validity line available; no operational content parsed. Hidden by default.';

            if (chips.includes('GNSS')) {
              if (/SPOOF/.test(up) && /JAMM/.test(up)) return 'GNSS jamming / spoofing reported. Use caution for RNAV/RNP and cross-check navigation.';
              if (/GPS.*(CAN NOT|CANNOT|NOT).*RECEIVED|GPS SIGNAL/.test(up)) return 'GPS signal loss reported in this FIR. Use caution for RNAV/RNP procedures.';
              return 'GNSS reliability notice. Conventional navigation / ATC cross-check may be required.';
            }
            if (chips.includes('ROUTE CLSD')) {
              const airway = s.match(/\b(?:AWY\s+)?(?:N\/UN|M\/UM|U?M|U?N|P|B|A|L|J|V)\d{2,4}\b/i);
              return airway ? `${airway[0].toUpperCase()} segment / route closure. Check planned routing and alternatives.` : 'ATS route or segment closure. Check planned routing and alternatives.';
            }
            if (chips.includes('KABUL') && /ATS NOT AVAILABLE/i.test(s)) return 'Kabul FIR ATS not available. Apply published TIBA / company procedures.';
            if (chips.includes('KABUL') && /LONGITUDINAL|SPACING/i.test(s)) return 'Kabul FIR entry may require spacing / delaying action. Expect ATC flow restriction.';
            if (chips.includes('OFFSET/SPACING')) return 'Special offset / spacing procedure applies. Confirm route-specific procedure before entry.';
            if (chips.includes('ESCAPE')) return 'Escape / decompression / diversion procedure notice. Review company escape-zone guidance.';
            if (chips.includes('BORDER')) return 'Border / restricted FIR avoidance notice. Maintain planned routing and avoid unauthorized deviation.';
            if (chips.includes('AIRSPACE')) return 'Restricted / special activity airspace active. Check lateral and vertical relevance.';
            if (chips.includes('ATC/COMM')) return 'ATC / communication procedure notice. Check frequency or contact requirement.';
            if (chips.includes('COMPANY')) return 'Company NOTAM. Review procedure or operational note relevant to this route.';

            const firstSentence = s.split(/(?<=\.)\s+/)[0] || s;
            return firstSentence.length > 180 ? firstSentence.slice(0, 180) + '...' : firstSentence;
          };

          const extractSections = (text, routeOrder) => {
            const clean = sanitize(text);
            const lines = clean.split('\n');
            const routeMap = new Map(routeOrder.map(item => [item.code, item]));
            const sections = [];
            let current = null;
            let currentFir = null;

            const isHeader = (line, next) => {
              const h = line.trim();
              const n = (next || '').trim();
              if (!h || !/^-{6,}$/.test(n)) return false;
              if (/^(BR\s+\d+|PAGE|OFP|VALIDITY|WIND SUMMARY|AIRPORT WX|DESTINATION|ALTERNATE|TAKEOFF|LANDING|RMK)/i.test(h)) return false;
              if (!/^[A-Z0-9_\/ .-]{3,80}$/.test(h)) return false;
              return /\b(FIR|UIR|DCT|P\d{2,4}|N\d{2,4}|L\d{2,4}|M\d{2,4}|B\d{2,4}|A\d{2,4}|J\d{2,4}|V\d{2,4}|COMPANY|NOTAM)\b/i.test(h);
            };

            const flush = () => {
              if (!current) return;
              const body = current.body.join('\n').trim();
              const blocks = parseNotamBlocks(body);
              if (blocks.length > 0 || /^\s*NIL\s*$/i.test(body)) {
                sections.push({ ...current, body, blocks });
              }
            };

            for (let i = 0; i < lines.length - 1; i++) {
              if (isHeader(lines[i], lines[i + 1])) {
                flush();
                const header = lines[i].trim().replace(/_/g, ' ');
                const codeMatch = header.match(/\b([A-Z]{4})\b/);
                const code = codeMatch ? codeMatch[1] : (currentFir ? currentFir.code : 'ROUTE');
                if (/\b(FIR|UIR)\b/i.test(header) && codeMatch) {
                  currentFir = { code, name: header };
                }
                const orderInfo = routeMap.get(code);
                current = {
                  header,
                  code,
                  firName: orderInfo ? orderInfo.name : (currentFir ? currentFir.name : header),
                  order: orderInfo ? orderInfo.idx : 999,
                  body: []
                };
                i++;
              } else if (current) {
                current.body.push(lines[i]);
              }
            }
            flush();
            return sections;
          };

          useEffect(() => {
            if (!rawText) {
              setGroups([]);
              return;
            }
            const routeOrder = extractRouteFirOrder(rawText);
            const sections = extractSections(rawText, routeOrder);

            const allItems = [];
            sections.forEach(section => {
              section.blocks.forEach(block => {
                const chips = getChips(block.text, section.header);
                const level = classifyNotam(block.text, section.header);
                const summary = buildSummary(block.text, section.header, chips, level);
                const validOnly = isValidOnlyNotam(block.text);
                const lowValue = validOnly || (level === 'INFO' && !chips.some(c => ['GNSS','ROUTE CLSD','KABUL','COMPANY','ATC/COMM','AIRSPACE','ESCAPE','BORDER'].includes(c)));
                allItems.push({
                  ...block,
                  sectionHeader: section.header,
                  code: section.code,
                  firName: section.firName,
                  order: section.order,
                  chips,
                  level,
                  summary,
                  lowValue,
                  validOnly
                });
              });
            });

            const groupedMap = new Map();
            allItems.forEach(item => {
              const key = `${String(item.order).padStart(3,'0')}-${item.code}-${item.firName}`;
              if (!groupedMap.has(key)) groupedMap.set(key, { code: item.code, firName: item.firName, order: item.order, items: [] });
              groupedMap.get(key).items.push(item);
            });

            // 只保留 Navigation Log / ICAO FPL EET 裡實際航路經過的 FIR。
            // order === 999 代表 PDF 後段一般 FIR NOTAM，不屬於本航路，預設完全排除。
            const sorted = Array.from(groupedMap.values())
              .filter(g => g.order < 999)
              .sort((a,b) => a.order - b.order || a.firName.localeCompare(b.firName));
            sorted.forEach(g => {
              g.items.sort((a,b) => {
                const rank = { CRITICAL: 0, CAUTION: 1, COMPANY: 2, INFO: 3 };
                return (rank[a.level] || 9) - (rank[b.level] || 9);
              });
            });

            const initialExpanded = {};
            sorted.forEach(g => {
              const criticalCount = g.items.filter(i => i.level === 'CRITICAL').length;
              if (criticalCount > 0) initialExpanded[`${g.code}-${g.firName}`] = true;
            });
            setExpandedGroups(initialExpanded);
            setExpandedNotams({});
            setImportantFirNotams([]);
            setGroups(sorted);
          }, [rawText]);

          const allItems = groups.flatMap(g => g.items);
          const meaningfulItems = allItems.filter(i => !i.validOnly);
          const counts = {
            ALL: meaningfulItems.length,
            CRITICAL: meaningfulItems.filter(i => i.level === 'CRITICAL').length,
            CAUTION: meaningfulItems.filter(i => i.level === 'CAUTION').length,
            COMPANY: meaningfulItems.filter(i => i.level === 'COMPANY').length,
            INFO: meaningfulItems.filter(i => i.level === 'INFO').length
          };

          const visibleGroups = groups.map(g => ({
            ...g,
            items: g.items.filter(item => {
              if (!showLow && item.lowValue) return false;
              if (activeFilter !== 'ALL' && item.level !== activeFilter) return false;
              return true;
            })
          })).filter(g => g.items.length > 0);

          const levelStyle = {
            CRITICAL: 'bg-rose-100 text-rose-800 border-rose-200',
            CAUTION: 'bg-amber-100 text-amber-800 border-amber-200',
            COMPANY: 'bg-sky-100 text-sky-800 border-sky-200',
            INFO: 'bg-slate-100 text-slate-700 border-slate-200'
          };

          const levelLabel = {
            CRITICAL: 'Critical',
            CAUTION: 'Caution',
            COMPANY: 'Company',
            INFO: 'Info'
          };

          const toggleGroup = (key) => setExpandedGroups(prev => ({ ...prev, [key]: !prev[key] }));
          const toggleNotam = (key) => setExpandedNotams(prev => ({ ...prev, [key]: !prev[key] }));
          const getImportantKey = (item) => `${item.code}-${item.id}-${item.sectionHeader}`;
          const toggleImportantFirNotam = (item) => {
            const key = getImportantKey(item);
            setImportantFirNotams(prev => {
              if (prev.some(x => x.key === key)) return prev.filter(x => x.key !== key);
              return [...prev, { key, ...item }];
            });
          };
          const isImportantFirNotam = (item) => importantFirNotams.some(x => x.key === getImportantKey(item));

          if (!rawText) return null;

          return (
            <div className="max-w-6xl mx-auto px-3 mt-3 pb-4">
              <div className="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 text-white p-5">
                  <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
                    <div>
                      <div className="text-2xl font-black tracking-wide">ENROUTE FIR NOTAM</div>
                      <div className="text-slate-300 text-sm mt-1"></div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {['ALL','CRITICAL','CAUTION','COMPANY','INFO'].map(key => (
                        <button
                          key={key}
                          onClick={() => setActiveFilter(key)}
                          className={`px-3 py-1.5 rounded-full text-xs font-black border transition ${activeFilter === key ? 'bg-white text-slate-900 border-white' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                        >
                          {key === 'ALL' ? 'All' : levelLabel[key]} {counts[key] || 0}
                        </button>
                      ))}
                      <button
                        onClick={() => setShowLow(!showLow)}
                        className={`px-3 py-1.5 rounded-full text-xs font-black border transition ${showLow ? 'bg-slate-200 text-slate-900 border-slate-200' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                      >
                        {showLow ? '隱藏低相關' : '顯示低相關'}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="p-4 sm:p-6 bg-slate-50">
                  {allItems.length === 0 ? (
                    <div className="bg-white border border-dashed border-slate-300 rounded-2xl p-10 text-center text-slate-500">
                      <CheckCircle className="w-12 h-12 mx-auto mb-3 opacity-50" />
                      <div className="font-bold">沒有解析到 ENROUTE FIR NOTAM</div>
                      <div className="text-sm mt-1">若 OFP 內沒有與本航路 FIR 對應的 NOTAM，這裡會保持空白。</div>
                    </div>
                  ) : (
                    <div className="space-y-5">
                      {importantFirNotams.length > 0 && (
                        <section className="bg-amber-50 border-2 border-amber-300 rounded-2xl shadow-sm overflow-hidden">
                          <div className="p-4 border-b border-amber-200 bg-amber-100/70 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                            <div>
                              <div className="font-black text-amber-900 text-xl flex items-center gap-2">
                                <Star className="w-5 h-5 text-amber-600" fill="currentColor" />
                                標記的重要 FIR NOTAM
                              </div>
                              <div className="text-sm text-amber-800 mt-1"></div>
                            </div>
                            <button
                              onClick={() => setImportantFirNotams([])}
                              className="px-3 py-1.5 rounded-lg bg-white border border-amber-300 text-amber-800 text-xs font-black hover:bg-amber-50"
                            >
                              清除全部
                            </button>
                          </div>
                          <div className="p-4 space-y-3">
                            {importantFirNotams.map((item, idx) => {
                              const nkey = `important-${item.key}-${idx}`;
                              const nOpen = !!expandedNotams[nkey];
                              return (
                                <div key={nkey} className="rounded-xl border border-amber-300 bg-white p-4 shadow-sm">
                                  <div className="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-3">
                                    <div className="min-w-0">
                                      <div className="flex flex-wrap items-center gap-2 mb-2">
                                        <span className={`px-2.5 py-1 rounded-full text-xs font-black border ${levelStyle[item.level]}`}>{levelLabel[item.level]}</span>
                                        <span className="text-sm font-black text-slate-700">{item.id}</span>
                                        <span className="text-xs text-slate-400">{item.firName}</span>
                                      </div>
                                      <div className="text-slate-900 font-bold leading-relaxed break-words">{item.summary}</div>
                                      <div className="flex flex-wrap gap-1.5 mt-3">
                                        {item.chips.map(chip => (
                                          <span key={chip} className="px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200 text-[10px] font-black text-slate-600">{chip}</span>
                                        ))}
                                      </div>
                                    </div>
                                    <div className="flex shrink-0 gap-2">
                                      <button
                                        onClick={() => toggleNotam(nkey)}
                                        className="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 text-xs font-black hover:bg-slate-50"
                                      >
                                        {nOpen ? '收合原文' : 'Show original'}
                                      </button>
                                      <button
                                        onClick={() => toggleImportantFirNotam(item)}
                                        className="px-3 py-1.5 rounded-lg bg-amber-100 border border-amber-300 text-amber-800 text-xs font-black hover:bg-amber-200"
                                      >
                                        取消標記
                                      </button>
                                    </div>
                                  </div>
                                  {nOpen && (
                                    <pre className="mt-4 p-3 rounded-xl bg-slate-900 text-slate-100 text-xs leading-relaxed whitespace-pre-wrap break-words overflow-x-hidden">
{item.text}
                                    </pre>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </section>
                      )}

                      {visibleGroups.map((group, gidx) => {
                        const gkey = `${group.code}-${group.firName}`;
                        const groupCounts = {
                          critical: group.items.filter(i => i.level === 'CRITICAL').length,
                          caution: group.items.filter(i => i.level === 'CAUTION').length,
                          company: group.items.filter(i => i.level === 'COMPANY').length,
                          info: group.items.filter(i => i.level === 'INFO').length
                        };
                        const isOpen = !!expandedGroups[gkey];

                        return (
                          <section key={gkey} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            <button
                              onClick={() => toggleGroup(gkey)}
                              className="w-full p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 hover:bg-slate-50 transition text-left"
                            >

              />
