        // ==========================================
        // 模組：Crew Rest Calculator
        // ==========================================
        function RestCalcApp({ ofpData }) {
          const getFlightTimeFromOFP = () => {
            const raw = ofpData?.flightTime || '';
            const m = String(raw).match(/(\d{1,2})[:Hh](\d{2})/);
            if (!m) return '';
            return `${m[1].padStart(2, '0')}:${m[2]}`;
          };

          const [flightTime, setFlightTime] = useState(getFlightTimeFromOFP());
          const [crew, setCrew] = useState('4P');
          const [restStart, setRestStart] = useState('');
          const [fixedWindow, setFixedWindow] = useState('');
          const [manualWindow, setManualWindow] = useState(false);
          const [manualDurations, setManualDurations] = useState({});

          const parseHHMM = (value) => {
            const s = String(value || '').trim();
            const m = s.match(/^(\d{1,2})(?::?(\d{2}))$/);
            if (!m) return null;
            const h = parseInt(m[1], 10);
            const min = parseInt(m[2], 10);
            if (h > 47 || min > 59) return null;
            return h * 60 + min;
          };

          const formatHHMM = (mins) => {
            if (mins === null || mins === undefined || Number.isNaN(mins)) return '—';
            const day = Math.floor(mins / 1440);
            const mod = ((mins % 1440) + 1440) % 1440;
            const h = Math.floor(mod / 60);
            const m = mod % 60;
            return `${String(h).padStart(2, '0')}${String(m).padStart(2, '0')}${day > 0 ? ` +${day}` : ''}`;
          };

          const formatDuration = (mins) => {
            if (mins === null || mins === undefined || Number.isNaN(mins)) return '';
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          };

          const displayDuration = (mins) => formatDuration(mins) || '—';

          const roundDown5 = (mins) => {
            if (mins === null || mins === undefined || Number.isNaN(mins)) return null;
            return Math.floor(mins / 5) * 5;
          };

          const defaultWindowFromFlightTime = () => {
            const mins = parseHHMM(flightTime);
            if (mins === null) return '';
            return formatDuration(roundDown5(Math.max(0, mins - 70)));
          };

          useEffect(() => {
            const next = getFlightTimeFromOFP();
            if (next && !flightTime) setFlightTime(next);
          }, [ofpData]);

          useEffect(() => {
            if (!manualWindow) {
              const next = defaultWindowFromFlightTime();
              if (next) setFixedWindow(next);
            }
          }, [flightTime, manualWindow]);

          const handleFlightTimeChange = (value) => {
            setFlightTime(value);
            if (!manualWindow) {
              const mins = parseHHMM(value);
              if (mins !== null) setFixedWindow(formatDuration(roundDown5(Math.max(0, mins - 70))));
            }
          };

          const handleFixedWindowChange = (value) => {
            const cleaned = String(value || '').replace(/[^\d:]/g, '').slice(0, 5);
            setManualWindow(true);
            setFixedWindow(cleaned);
          };

          const resetFixedWindow = () => {
            setManualWindow(false);
            const next = defaultWindowFromFlightTime();
            if (next) setFixedWindow(next);
          };

          const windowMins = parseHHMM(fixedWindow);
          const restStartMins = parseHHMM(restStart);
          const totalCrew = crew === '4P' ? 4 : 3;
          const groupTotalMins = windowMins !== null && crew === '4P' ? roundDown5(Math.floor(windowMins / 2)) : null;
          const perPersonMins = windowMins !== null ? roundDown5(Math.floor(windowMins / totalCrew)) : null;

          const cleanDurationInput = (value) => String(value || '').replace(/[^\d:]/g, '').slice(0, 5);
          const defaultManualDuration = () => perPersonMins !== null ? formatDuration(perPersonMins) : '';

          const getManualDuration = (label) => {
            if (manualDurations[label] !== undefined) return manualDurations[label];
            return defaultManualDuration();
          };

          const updateManualDuration = (label, value) => {
            setManualDurations(prev => ({ ...prev, [label]: cleanDurationInput(value) }));
          };

          const buildRows = () => {
            const rows = [];
            let cursor = restStartMins;

            const pushRow = ({ label, group, duration, auto = false, editable = false }) => {
              const start = cursor;
              const end = start !== null && duration !== null ? start + duration : null;
              rows.push({ label, group, duration, start, end, auto, editable });
              if (end !== null) cursor = end;
            };

            if (crew === '3P') {
              ['A', 'B', 'C'].forEach(label => {
                pushRow({
                  label,
                  group: '3P',
                  duration: perPersonMins,
                  auto: true,
                  editable: false
                });
              });
              return rows;
            }

            // 4P order: (A/B), (C/D), (A/B), (C/D) = A, C, B, D.
            const targetAB = groupTotalMins;
            const targetCD = groupTotalMins;

            let durA = parseHHMM(getManualDuration('A'));
            if (durA === null) durA = perPersonMins || 0;
            if (targetAB !== null) durA = Math.min(durA, targetAB);

            let durC = parseHHMM(getManualDuration('C'));
            if (durC === null) durC = perPersonMins || 0;
            if (targetCD !== null) durC = Math.min(durC, targetCD);

            const durB = targetAB !== null ? Math.max(0, targetAB - durA) : null;
            const durD = targetCD !== null ? Math.max(0, targetCD - durC) : null;

            pushRow({ label: 'A', group: 'A/B', duration: durA, editable: true });
            pushRow({ label: 'C', group: 'C/D', duration: durC, editable: true });
            pushRow({ label: 'B', group: 'A/B', duration: durB, auto: true });
            pushRow({ label: 'D', group: 'C/D', duration: durD, auto: true });

            return rows;
          };

          const rows = buildRows();

          return (
            <div className="max-w-6xl mx-auto px-3 mt-3 pb-4">
              <div className="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 text-white px-5 py-5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                  <div>
                    <h2 className="text-xl font-black flex items-center gap-2">⌛ Crew Rest Calc</h2>

                  </div>
                  <button onClick={resetFixedWindow} className="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-black">
                    依 Flight Time 重算
                  </button>
                </div>

                <div className="p-3 bg-slate-50 space-y-2">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <RestInputField label="Flight Time" value={flightTime} onChange={handleFlightTimeChange} />
                    <label className="flex flex-col gap-1">
                      <span className="text-xs font-black text-slate-500">Crew</span>
                      <select value={crew} onChange={(e) => setCrew(e.target.value)} className="bg-white border border-slate-300 rounded-xl px-4 py-3 text-xl font-black text-slate-800">
                        <option value="3P">3P</option>
                        <option value="4P">4P</option>
                      </select>
                    </label>
                    <RestInputField label="Rest Start (UTC)" value={restStart} onChange={setRestStart} placeholder="HHMM" />
                    <RestInputField label="Fixed Rest Window" value={fixedWindow} onChange={handleFixedWindowChange} placeholder="HH:MM" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-white rounded-2xl border border-slate-200 p-4">
                      <div className="text-xs font-black text-slate-500 mb-1">Fixed Rest Window</div>
                      <div className="text-3xl font-black text-slate-800">{displayDuration(windowMins)}</div>
                      <div className="text-xs text-slate-400 font-bold mt-1">
                        {manualWindow ? '已手動調整；可按「依 Flight Time 重算」恢復。' : '自動使用 Flight Time - 1:10，並向下取整到 5 分鐘。'}
                      </div>
                    </div>
                    <div className="bg-white rounded-2xl border border-slate-200 p-4">
                      <div className="text-xs font-black text-slate-500 mb-1">{crew === '4P' ? 'Group Total' : 'Duration / Person'}</div>
                      <div className="text-3xl font-black text-blue-700">{crew === '4P' ? displayDuration(groupTotalMins) : displayDuration(perPersonMins)}</div>
                    </div>
                    <div className="bg-white rounded-2xl border border-slate-200 p-4">
                      <div className="text-xs font-black text-slate-500 mb-1">{crew === '4P' ? 'Default First Rest' : 'Crew Count'}</div>
                      <div className="text-3xl font-black text-emerald-700">{crew === '4P' ? displayDuration(perPersonMins) : totalCrew}</div>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                    <div className="grid grid-cols-4 bg-slate-100 border-b border-slate-200 text-xs font-black text-slate-500">
                      <div className="p-3">Crew</div>
                      <div className="p-3">Start</div>
                      <div className="p-3">Duration</div>
                      <div className="p-3">End</div>
                    </div>
                    {rows.map((r, idx) => {
                      const key = `${r.group}-${r.label}-${idx}`;
                      return (
                        <div key={key} className="grid grid-cols-4 items-center border-b last:border-b-0 border-slate-100">
                          <div className="p-3">
                            <div className="font-black text-blue-700 text-lg">{crew === '4P' ? r.group : r.label}</div>
                          </div>
                          <div className="p-3 font-mono font-black text-slate-700">{formatHHMM(r.start)}</div>
                          <div className="p-3">
                            {r.editable ? (
                              <input
                                value={getManualDuration(r.label)}
                                onChange={(e) => updateManualDuration(r.label, e.target.value)}
                                placeholder="HH:MM"
                                inputMode="numeric"
                                autoComplete="off"
                                className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 font-mono font-black text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-400"
                              />
                            ) : (
                              <div className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 font-mono font-black text-emerald-700">
                                {displayDuration(r.duration)}
                              </div>
                            )}
                          </div>
                          <div className="p-3 font-mono font-black text-emerald-700">{formatHHMM(r.end)}</div>
                        </div>
                      );
                    })}
                  </div>
</div>
              </div>
            </div>
          );
        }


        // ==========================================
        // 模組：PA 廣播稿（一頁式、分類切換、無水平滑動）
        // ==========================================
        function PAApp({ ofpData, atisData }) {
          const [activePa, setActivePa] = useState('WELCOME');

            const compact = String(value).replace(/\s+/g, '');
            const br = compact.match(/BR?\s*(\d+[A-Z]?)/i);
            if (br) return br[1];
            const digits = compact.match(/\d+[A-Z]?/);
            return digits ? digits[0] : compact;
          };

          const airportMap = {
            RCTP: { zh: '台北桃園國際機場', en: 'Taipei Taoyuan International Airport' },
            RCSS: { zh: '台北松山機場', en: 'Taipei Songshan Airport' },
            RJAA: { zh: '東京成田國際機場', en: 'Tokyo Narita International Airport' },
            RJTT: { zh: '東京羽田機場', en: 'Tokyo Haneda Airport' },
            RJBB: { zh: '大阪關西國際機場', en: 'Osaka Kansai International Airport' },
            VHHH: { zh: '香港國際機場', en: 'Hong Kong International Airport' },
            RKSI: { zh: '首爾仁川國際機場', en: 'Seoul Incheon International Airport' },
            ZSPD: { zh: '上海浦東國際機場', en: 'Shanghai Pudong International Airport' },
            ZBAA: { zh: '北京首都國際機場', en: 'Beijing Capital International Airport' },
            VTBS: { zh: '曼谷蘇凡納布國際機場', en: 'Bangkok Suvarnabhumi Airport' },
            WSSS: { zh: '新加坡樟宜機場', en: 'Singapore Changi Airport' },
            KLAX: { zh: '洛杉磯國際機場', en: 'Los Angeles International Airport' },
            KSFO: { zh: '舊金山國際機場', en: 'San Francisco International Airport' },
            KSEA: { zh: '西雅圖塔科馬國際機場', en: 'Seattle Tacoma International Airport' },
            KORD: { zh: '芝加哥歐海爾國際機場', en: "Chicago O'Hare International Airport" },
            KJFK: { zh: '紐約甘迺迪國際機場', en: 'New York John F. Kennedy International Airport' },
            EGLL: { zh: '倫敦希斯洛機場', en: 'London Heathrow Airport' },
            LFPG: { zh: '巴黎戴高樂機場', en: 'Paris Charles de Gaulle Airport' },
            EHAM: { zh: '阿姆斯特丹史基浦機場', en: 'Amsterdam Schiphol Airport' },
            LOWW: { zh: '維也納國際機場', en: 'Vienna International Airport' },
            LIMC: { zh: '米蘭馬爾彭薩機場', en: 'Milan Malpensa Airport' }
          };

          const airportName = (icao, lang) => {
            if (!icao || icao === 'N/A') return '____';
            const item = airportMap[String(icao).toUpperCase()];
            return item ? item[lang] : String(icao).toUpperCase();
          };

          const parseTempFromWeather = (weather, icao) => {
            const list = Array.isArray(weather) ? weather : [];
            const joined = list.map(w => typeof w === 'string' ? w : Object.values(w || {}).join(' ')).join('\n');
            const target = icao ? joined.split('\n').find(line => line.includes(icao)) || joined : joined;
            const m = target.match(/\b(M?\d{2})\/(M?\d{2})\b/);
            if (!m) return { c: '___', f: '___' };
            const c = m[1].startsWith('M') ? -parseInt(m[1].slice(1), 10) : parseInt(m[1], 10);
            return { c, f: Math.round(c * 9 / 5 + 32) };
          };

          const pickAtisForPA = (icao, role) => {
            const airportData = atisData && icao ? atisData[icao] : null;
            if (!airportData) return null;
            const atis = role === 'DEP' ? (airportData.dep || airportData.arr) : (airportData.arr || airportData.dep);
            return {
              text: atis?.text || '',
              time: atis?.time || '',
              metar: airportData.metar || '',
              taf: airportData.taf || ''
            };
          };

          const parseAtisForPA = (text, metar) => {
            const raw = `${text || ''} ${metar || ''}`.toUpperCase();
            const tempMatch = raw.match(/\b(?:TEMP(?:ERATURE)?|T)\s*(M?\d{1,2})\b/i) || raw.match(/\b(M?\d{2})\/(?:M?\d{2}|\/\/)\b/i);
            let tempC = null;
            if (tempMatch) {
              const t = tempMatch[1].replace('M', '-');
              tempC = parseInt(t, 10);
            }

            let wxZh = '良好';
            let wxEn = 'good';
            if (/\b(?:\+?TS|TSRA|VCTS|CB)\b/.test(raw)) { wxZh = '有雷雨或積雨雲活動'; wxEn = 'thunderstorm activity in the vicinity'; }
            else if (/\b(?:\+?SN|SHSN|FZRA|FZDZ|PL|SG)\b/.test(raw)) { wxZh = '下雪或有冬季天氣'; wxEn = 'snowing or winter weather conditions'; }
            else if (/\b(?:\+?RA|SHRA|DZ)\b/.test(raw)) { wxZh = '下雨'; wxEn = 'raining'; }
            else if (/\b(?:FG|FZFG)\b/.test(raw)) { wxZh = '起霧'; wxEn = 'foggy'; }
            else if (/\b(?:BR|HZ|FU|DU|SA)\b/.test(raw)) { wxZh = '能見度略受影響'; wxEn = 'reduced visibility'; }
            else if (/\b(?:BKN|OVC)\b/.test(raw)) { wxZh = '多雲'; wxEn = 'cloudy'; }
            else if (/\b(?:FEW|SCT)\b/.test(raw)) { wxZh = '部分多雲'; wxEn = 'partly cloudy'; }
            else if (/\b(?:CAVOK|SKC|NSC|CLR)\b/.test(raw)) { wxZh = '晴朗或良好'; wxEn = 'clear or good'; }

            const windMatch = raw.match(/\bWIND(?:\s+(?:TDZ|MID|END))?\s+((?:[0-3]\d{2}|VRB)\/?\d{1,3}(?:G\d{1,3})?KT|(?:[0-3]\d{2}|VRB)\d{2,3}(?:G\d{2,3})?KT)/i) || raw.match(/\b((?:[0-3]\d{2}|VRB)\d{2,3}(?:G\d{2,3})?KT)\b/i);
            const visMatch = raw.match(/\bVIS\s*([0-9]{3,5}M?|[0-9]+KM|CAVOK)\b/i) || raw.match(/\b(CAVOK)\b/i);
            return {
              wxZh,
              wxEn,
              tempC: tempC !== null && !Number.isNaN(tempC) ? tempC : null,
              tempF: tempC !== null && !Number.isNaN(tempC) ? Math.round(tempC * 9 / 5 + 32) : null,
              wind: windMatch ? windMatch[1].replace('/', '') : '',
              vis: visMatch ? (visMatch[1] || visMatch[0]) : ''
            };
          };

          const formatFlightTime = (value) => {
            if (!value || value === 'N/A') return { zh: '___小時___分', en: '___ hours and ___ minutes' };
            const m = String(value).match(/(\d{1,2})[:Hh](\d{2})/);
            if (!m) return { zh: String(value), en: String(value) };
            return { zh: `${parseInt(m[1], 10)}小時${parseInt(m[2], 10)}分`, en: `${parseInt(m[1], 10)} hours and ${parseInt(m[2], 10)} minutes` };
          };

          const getAltitude = (value) => {
            if (!value || value === 'N/A') return '______';
            const m = String(value).match(/FL\s*(\d{3})/i) || String(value).match(/\b(\d{3})\b/);
            return m ? String(parseInt(m[1], 10) * 100) : String(value);
          };

          const formatSta = (value) => {
            if (!value || value === 'N/A') return '________';

            if (!m) return String(value);
            const h = parseInt(m[1], 10);
            const min = m[2];
            const h12 = h % 12 || 12;
            return `${h12}:${min} ${h >= 12 ? 'PM' : 'AM'}`;
          };

          const parseOFPDate = (value) => {
            if (!value || value === 'N/A') return null;
            const m = String(value).match(/(\d{2})([A-Za-z]{3})(\d{2})/);
            if (!m) return null;
            const months = { JAN:0, FEB:1, MAR:2, APR:3, MAY:4, JUN:5, JUL:6, AUG:7, SEP:8, OCT:9, NOV:10, DEC:11 };
            const mon = months[m[2].toUpperCase()];
            if (mon === undefined) return null;
            return new Date(Date.UTC(2000 + parseInt(m[3], 10), mon, parseInt(m[1], 10)));
          };

          const formatZhStaWithDate = (dateValue, stdL, staL) => {
            const staMatch = String(staL || '').match(/(\d{2})(\d{2})/);
            if (!staMatch) return ' 月 號 上午';
            const h = parseInt(staMatch[1], 10);
            const min = staMatch[2];
            const baseDate = parseOFPDate(dateValue);
            if (!baseDate) {
              return `${h < 12 ? '上午' : '下午'} ${h % 12 || 12}:${min}`;
            }

            const stdMatch = String(stdL || '').match(/(\d{2})(\d{2})/);
            if (stdMatch) {
              const stdMinutes = parseInt(stdMatch[1], 10) * 60 + parseInt(stdMatch[2], 10);
              const staMinutes = h * 60 + parseInt(min, 10);
              if (staMinutes < stdMinutes) baseDate.setUTCDate(baseDate.getUTCDate() + 1);
            }

            return `${baseDate.getUTCMonth() + 1}月${baseDate.getUTCDate()}日 ${h < 12 ? '上午' : '下午'}${h % 12 || 12}:${min}`;

        function App() {

          useEffect(() => {
            const handleScroll = () => setShowTopBtn(window.scrollY > 300);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

          const handleGlobalFileUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            setGlobalLoading(true);
            setGlobalError(null);
            
            setTimeout(async () => {
              try {
                const pdfjsLib = window.pdfjsLib;
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = '';
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i); 
                    const content = await page.getTextContent();
                    let linesMap = new Map();
                    content.items.forEach(item => { 
                        let y = Math.round(item.transform[5] / 4) * 4; 
                        if (!linesMap.has(y)) linesMap.set(y, []); 
                        linesMap.get(y).push(item); 
                    });
                    let yKeys = Array.from(linesMap.keys()).sort((a, b) => b - a);
                    let pageText = yKeys.map(y => {
                        let lineItems = linesMap.get(y); lineItems.sort((a, b) => a.transform[4] - b.transform[4]);
                        let lineStr = ''; let lastX = -1;
                        lineItems.forEach(it => { 
                            if (lastX !== -1 && (it.transform[4] - lastX > 10)) lineStr += ' '; 
                            lineStr += it.str; lastX = it.transform[4] + it.width; 
                        });
                        return lineStr.trim();
                    }).join('\n'); 
                    fullText += pageText + '\n';
                }
                setSharedRawText(fullText);
              } catch (err) {
                console.error("Global PDF Error:", err);
                setGlobalError("讀取 PDF 失敗，請確認是否為有效 LIDO 文件。");
              } finally {
                setGlobalLoading(false);
              }
            }, 50);
          };

          const extractWeatherInfo = (wxData, icao) => {
              let wind = 'N/A', temp = 'N/A', qnh = 'N/A';
              if (!wxData) return { wind, temp, qnh };
              const aptWx = wxData.find(w => w.icao === icao);
              if (!aptWx || !aptWx.raw) return { wind, temp, qnh };
              
              const lines = aptWx.raw.split('\n');
              for (const line of lines) {
                  if (wind === 'N/A') {
                      const windMatch = line.match(/\b(\d{3}|VRB)\d{2,3}(G\d{2,3})?(KT|MPS)\b/);
                      if (windMatch) wind = windMatch[0];
                  }
                  if (temp === 'N/A') {
                      const tempMatch = line.match(/\b(M?\d{2})\/(M?\d{2}|[/]{2})\b/);
                      if (tempMatch) {
                          temp = tempMatch[1].replace('M', '-') + '°C';
                      }
                  }
                  if (qnh === 'N/A') {
                      const qnhMatch = line.match(/\b([AQ]\d{4})\b/);
                      if (qnhMatch) qnh = qnhMatch[1];
                  }
                  if (wind !== 'N/A' && temp !== 'N/A' && qnh !== 'N/A') break;

                                      document.body.removeChild(textArea);
                                  });
                              }} className="flex items-center justify-center gap-2 px-6 py-2.5 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 active:scale-95 transition-all">
                                  <Clipboard className="w-4 h-4" /> 複製純文字
                              </button>
                          </div>
                      </div>
                  </div>
              )}

              {showTopBtn && (
                <button 
                  onClick={scrollToTop} 
                  className="fixed bottom-8 right-8 sm:bottom-12 sm:right-12 bg-slate-800 text-white p-3 sm:px-5 sm:py-3.5 rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.5)] hover:bg-slate-700 hover:-translate-y-1 transition-all duration-300 z-[999] opacity-90 hover:opacity-100 flex items-center gap-2" 
                  title="回到最上方"
                >
                  <ChevronUp className="w-6 h-6" />
                  <span className="hidden sm:inline font-bold tracking-wider">TOP</span>
                </button>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
